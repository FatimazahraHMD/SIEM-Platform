<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Bienvenue</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 700px; margin: 40px auto; background: #f4f4f4; color: #222; }
        h1 { color: #2c3e50; }
        .box { background: #fff; padding: 20px; border-radius: 8px; }
        .warning { background: #fff3cd; border: 1px solid #ffe08a; padding: 10px 14px; border-radius: 6px; font-size: 0.9em; margin-bottom: 20px; }
    </style>
</head>
<body>
    <h1>👋 Bienvenue</h1>
    <div class="box" id="message">Chargement...</div>

    <script>
        /*
            ⚠️ VULNÉRABILITÉ VOLONTAIRE :
            Le nom est lu directement depuis l'URL (?name=...) côté navigateur,
            puis injecté tel quel dans le HTML de la page via innerHTML,
            SANS jamais transiter par le serveur -> DOM-based XSS.
        */
        const params = new URLSearchParams(window.location.search);
        const name = params.get("name") || "invité";
        document.getElementById("message").innerHTML = "Bonjour, " + name + " !";
    </script>
</body>
</html>
