


<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Recherche</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 700px; margin: 40px auto; background: #f4f4f4; color: #222; }
        h1 { color: #2c3e50; }
        form { background: #fff; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        input[type=text] { width: 70%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #2c3e50; color: #fff; border: none; padding: 9px 16px; border-radius: 4px; cursor: pointer; }
        .result { background: #fff; padding: 14px; border-radius: 6px; }
        .warning { background: #fff3cd; border: 1px solid #ffe08a; padding: 10px 14px; border-radius: 6px; font-size: 0.9em; margin-bottom: 20px; }
    </style>
</head>
<body>
    <h1>🔍 Recherche</h1>

    <form action="/search" method="GET">
        <input type="text" name="q" placeholder="Rechercher...">
        <button type="submit">Chercher</button>
    </form>

    {% if q %}
    <div class="result">
        <!--
            VULNÉRABILITÉ :
            |safe désactive l'échappement automatique de Jinja2.
            "q" vient directement de l'URL (?q=...) et n'est jamais stocké
            -> Reflected XSS.
        -->
        Résultats pour : {{ q|safe }}
    </div>
    {% endif %}
</body>
</html>
